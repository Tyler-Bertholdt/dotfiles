general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 6, linear
    animation = fadeOut, 1, 6, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/dotfiles/To_Install/Wallpaper/wp29.jpg
    blur_passes = 0
}

input-field {
    monitor =
    size = 13%, 4%
    outline_thickness = 0
    check_color = rgba(176, 176, 176, 0.30) 
    inner_color = rgba(76,76,76,0.00) # no fill
    outer_color = rgba(76,76,76,0) # no fill
    fail_color = rgba(255 , 0 , 0 , 0.7)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Type Your Password &amp; Enter
    fail_text = Wrong Password
    dots_spacing = 0.3
    position = 0, 25
    halign = center
    valign = bottom
}
image {
    monitor =
    path = /home/tyler/dotfiles/To_Install/Wallpaper/1.webp
    size = 55
    rounding = -1 # no rounding
    border_size = 0
    position = 0, 85
    halign = center
    valign = bottom
}
label{
monitor =
text =<b>$USER</b>
font_size = 10
font_family = SF Display Text  
position = 1 , 62
halign = center
valign = bottom
}
# TIME
label {
    monitor =
    text =<b><span>$TIME</span></b># ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 57
     font_family= SF Pro Display
     position = 1 , -85
    color= rgba(255, 254, 254, 0.8)
    halign = center
    valign = top
}

# DATE
label {
    monitor =
       text = cmd[update:1000] echo "<b>$(date +'%A, %B %d')</b>"
    font_size = 15
    font_family = SF Pro Display 
    color= rgba(255, 254, 254, 0.8)
    position = 1 , -65
    halign = center
    valign = top
}
