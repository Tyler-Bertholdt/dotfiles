################
### MONITORS ###
################

monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

$terminal = xfce4-terminal
$fileManager = thunar
$menu = walker

#############################
### ENVIRONMENT VARIABLES ###
#############################


env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16

###################
### PERMISSIONS ###
###################


 ecosystem {
   enforce_permissions = 1
 }

 permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
 permission = /usr/(bin|local/bin)/hyprpicker, screencopy, allow
 permission = /usr/(bin|local/bin)/hyprlock, screencopy, allow
 permission = /usr/(bin|local/bin)/hyprshot, screencopy, allow
 permission = /usr/bin/grim, screencopy, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 5
    border_size = 2
#col.active_border   = rgba(4834d4ff) rgba(0abde3ff) 45deg
#col.inactive_border = rgba(1e272eff)
col.active_border = rgb(f0f0f0)
col.inactive_border = rgb(333333)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 4

    active_opacity = 1.0
    inactive_opacity = 1.80

  shadow {
    enabled = false
    range = 3              
    render_power = 1       
    color = 0x31a1e1ae     
    offset = 4.5, 4        
    scale = 1            
    sharp = false          
    ignore_window = true   
  }    

  blur {
  enabled = true	
  size = 3
  passes = 3
  ignore_opacity = true
  new_optimizations = true
  noise = 0.0
  }
  }  





layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, nwg-dock
layerrule = blur, nwg-drawer
layerrule = ignorezero, nwg-drawer
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
animations {
        enabled = yes, please :)
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


dwindle {
    pseudotile = true 
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 

}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 

    touchpad {
        natural_scroll = false
        disable_while_typing = false 
}


}


device {
    name = epic-mouse-v1
    sensitivity = 0.5
}
#
#################
### AUTOSTART ###
#################

exec-once = hyprlock
exec-once = nm-applet 
exec-once = blueman-applet
exec-once = hyprpaper
exec-once = waybar 
exec-once = nwg-dock-hyprland -w 5 -p bottom -mb 7 -lp start -l overlay -i 56 -ico ~/File_Save/manjaro-vector-logo-seeklogo/manjaro-seeklogo.png -c 'nwg-drawer -mb 0 -ml 0 -mt 0 -mr 0 -ovl -is 58 -closebtn none -spacing 30 -c 7 -nocats' & disown 
exec-once = swaync
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = syncthing serve --no-browser
exec-once = elephant
exec-once = hyprctl setcursor MacOS-Pixel-vr5 16
###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = CTRL_ALT, SPACE, exec, killall wofi
bind = CTRL_ALT, T, exec, $terminal
bind = CTRL_ALT, B, exec, brave
bind = CTRL_ALT, Q, exit,
bind = CTRL_ALT, F, exec, $fileManager
bind = CTRL_ALT, S, exec, killall blueman-manager ; blueman-manager
bind = CTRL_ALT , X , exec , hyprpicker --autocopy && notify-send -i clipboard "HyprPicker" "The Color Has Been Copy"
bind = CTRL_ALT , K , exec ,killall keepassxc ; keepassxc
bind = ALT, F4, killactive,
bind = ALT, W, togglefloating,
bind = ALT, E, exec, hyprctl dispatch pin
bind = ALT, TAB, exec, hyprctl dispatch cyclenext
bind = ALT, F2, exec, $menu
bind = ALT, SPACE, exec, $menu
bind = ALT, A, pseudo, 
bind = ALT, S, togglesplit,
bind = ALT, N , exec , swaync-client -t
bind = ALT, f , exec , hyprctl dispatch fullscreen
bind = ALT , D , exec , ~/.config/scripts/killwaybar.sh & ~/.config/scripts/dockreload.sh    
bind = ALT SHIFT, M , exec, sudo modprobe -r psmouse & modprobe psmouse

bind = $mainMod, E , exec , ~/.config/scripts/killwaybar.sh
bind = $mainMod, A , exec , ~/.config/scripts/reloadwaybar.sh
bind = $mainMod, W , exec , ~/.config/scripts/dockreload.sh
bind = $mainMod, D , exec , ~/.config/scripts/pin.sh
bind = $mainMod, R , exec , ~/.config/scripts/reloadboth.sh
bind = $mainMod, S, exec , /home/tyler/.config/scripts/float.sh
bind = $mainMod, Q , exec , ~/.config/scripts/swayncreload.sh
bind = $mainMod, P , exec , ~/.config/scripts/power_menu.py
bind = $mainMod, L , exec , hyprlock
bind = $mainMod, C , exec , hyprctl kill
bind = $mainMod, SPACE, exec ,nwg-drawer -mb 0 -ml 0 -mt 0 -mr 0 -ovl -is 58 -closebtn none -spacing 30 -c 7 -nocats

bind = , PRINT , exec , hyprshot -m region
bind = SHIFT, PRINT , exec , hyprshot -m output
bind = CTRL , PRINT , exec , hyprshot -m window

bind = SUPER_SHIFT, left, movefocus, l
bind = SUPER_SHIFT, right, movefocus, r
bind = SUPER_SHIFT, up, movefocus, u
bind = SUPER_SHIFT, down, movefocus, d
bind = ALT SHIFT, left,  movewindow, l
bind = ALT SHIFT, right, movewindow, r
bind = ALT SHIFT, up,    movewindow, u
bind = ALT SHIFT, down,  movewindow, d
bind = SUPER, 1, exec, hyprctl dispatch workspace 1;
bind = SUPER, 2, exec, hyprctl dispatch workspace 2;
bind = SUPER, 3, exec, hyprctl dispatch workspace 3;
bind = SUPER, 4, exec, hyprctl dispatch workspace 4;
bind = SUPER, 5, exec, hyprctl dispatch workspace 5;
bind = SUPER, 6, exec, hyprctl dispatch workspace 6;
bind = SUPER, 7, exec, hyprctl dispatch workspace 7;
bind = SUPER, 8, exec, hyprctl dispatch workspace 8;
bind = SUPER, 9, exec, hyprctl dispatch workspace 9;

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindle = ALT, left,  exec, hyprctl dispatch moveactive -30 0
bindle = ALT, right, exec, hyprctl dispatch moveactive 30 0
bindle = ALT, up,    exec, hyprctl dispatch moveactive 0 -30
bindle = ALT, down,  exec, hyprctl dispatch moveactive 0 30

bindle = SUPER, left,  exec, hyprctl dispatch resizeactive -30 0
bindle = SUPER, right, exec, hyprctl dispatch resizeactive 30 0
bindle = SUPER, up,    exec, hyprctl dispatch resizeactive 0 -30
bindle = SUPER, down,  exec, hyprctl dispatch resizeactive 0 30

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*

windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

