
################
### MONITORS ###
################

monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

$terminal = xfce4-terminal
$fileManager = thunar
$menu = wofi --show drun

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################


 ecosystem {
   enforce_permissions = 1
 }

 permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
 permission = /usr/(bin|local/bin)/hyprpicker, screencopy, allow
 permission = /usr/(bin|local/bin)/hyprlock, screencopy, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 13
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.90

  shadow {
    enabled = true
    range = 8              # Size or “spread” of the shadow. 6–10 gives soft, modern look.
    render_power = 3       # How quickly shadow falloff fades. 3–4 is smooth and natural.
    color = 0xee1a1a1a     # Shadow color with alpha (ends in ‘aa’ or ‘ee’ for transparency). Tweak for light/dark themes.
    offset = 5, 5          # Shifts shadow diagonally (optional, e.g., [5, 5])
    scale = 1.0            # Keeps shadow at normal scale.
    sharp = false          # false gives soft “glow”—set true for sharp, old-school shadow.
    ignore_window = true   # No shadow under window, only around.
  }
    

 blur {
    enabled = true
    size = 5        # Blur kernel size (5–8 is popular)
    passes = 2      # Number of blur passes (2–4 for softer/stronger blur)
    vibrancy = 0.00 # Adds color “pop” to blurred areas (0.2–0.3 is modern, 0 for none)
    xray = true     # Blur through all layers (optional, for layered/frosted look)
    special = true  # Allows blur on special/workspace surfaces
    new_optimizations = true # Enables performance optimizations
    ignore_opacity = true    # Blur applies even with opacity <1
    brightness = 1
    contrast = 1
    popups = true
    popups_ignorealpha = 0.6
    noise = 0.01    # Adds subtle film grain to softened background (0.01–0.05)
  }
    }
    

layerrule = blur, waybar 
layerrule = blur, swaync 
layerrule = blurpopups, waybar 
layerrule = blurpopups, swaync 
animations {
    enabled = yes, please :)


    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


dwindle {
    pseudotile = true 
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 

}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
#
#################
### AUTOSTART ###
#################

exec-once = nm-applet 
exec-once = waybar 
exec-once = hyprpaper
exec-once = swaync
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = CTRL_ALT, T, exec, $terminal
bind = CTRL_ALT, B, exec, firefox
bind = ALT, F4, killactive,
bind = CTRL_ALT, Q, exit,
bind = CTRL_ALT, F, exec, $fileManager
bind = ALT, 2, togglefloating,
bind = ALT, F2, exec, $menu
bind = ALT, P, pseudo, # dwindle
bind = ALT, S, togglesplit, # dwindle
bind = CTRL, F7, exec, ~/dotfiles/hypr/scripts/toggle-gammastep.sh
bind = $mainMod, E , exec , ~/.config/waybar/scripts/launch.sh
bind = $mainMod, R , exec , ~/.config/waybar/scripts/kill.sh
bind = $mainMod, Q , exec , ~/.config/swaync/scripts/kill.sh
bind = $mainMod, P , exec , ~/.config/hypr/scripts/power_menu.py
bind = $mainMod, L , exec , hyprlock 
bind = CTRL_ALT , X , exec , hyprpicker --autocopy && notify-send -i clipboard "HyprPicker" "The Color Has Been Copy"
bind = CTRL_ALT , K , exec ,killall keepassxc ; keepassxc
bind = ALT, M, exec , /home/tyler/.config/hypr/scripts/float.sh
bind = SHIFT , PRINT , exec , hyprshot -m output
bind = , PRINT , exec , hyprshot -m region
bind = CTRL , PRINT , exec , hyprshot -m window

bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d

bind = SUPER, 1, exec, hyprctl dispatch workspace 1;
bind = SUPER, 2, exec, hyprctl dispatch workspace 2;
bind = SUPER, 3, exec, hyprctl dispatch workspace 3;
bind = SUPER, 4, exec, hyprctl dispatch workspace 4;
bind = SUPER, 5, exec, hyprctl dispatch workspace 5;

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
##############################
### WINDOWS AND WORKSPACES ###
##############################


windowrule = float,class:^(kitty)$,title:^(kitty)$

windowrule = suppressevent maximize, class:.*

windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
